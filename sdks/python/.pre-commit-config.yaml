repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy --strict
        language: system
        types: [python]
        pass_filenames: false
        args: ["src/"]

      - id: bandit
        name: bandit
        entry: bandit -r src/ -c pyproject.toml
        language: system
        pass_filenames: false
