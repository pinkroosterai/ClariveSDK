[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarive-sdk"
version = "0.2.2"
description = "Official Python SDK for the Clarive Public API"
authors = [{ name = "Clarive" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "tenacity>=9,<10",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pinkroosterai/ClariveSDK"
Repository = "https://github.com/pinkroosterai/ClariveSDK"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "respx>=0.21,<1",
    "ruff>=0.15",
    "mypy>=1.19",
    "bandit>=1.9",
    "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clarive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=clarive --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.10"

[tool.bandit]
exclude_dirs = ["tests"]
